# Server
server.port=8085

# Application Name
spring.application.name=splitthebill

# ─── H2 Database (in-memory for local dev) ────────────────────
spring.datasource.url=jdbc:h2:mem:hotelsplitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8085/h2-console in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# JWT
app.jwt.secret=${JWT_SECRET:splitthebill-super-secret-jwt-key-must-be-at-least-512-bits-long-for-hs512-algorithm-2024}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AWS S3 (optional — leave blank if not using PDF export)
app.aws.bucket-name=splitthebill-pdfs
app.aws.region=${AWS_REGION:ap-south-1}
app.aws.access-key=${AWS_ACCESS_KEY:}
app.aws.secret-key=${AWS_SECRET_KEY:}

# Gemini AI — key set via GEMINI_API_KEY env var on the server
app.gemini.api-key=${GEMINI_API_KEY:}

# Logging
logging.level.com.hotelsplit=DEBUG
logging.level.org.springframework.security=INFO
