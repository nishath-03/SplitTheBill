# ============================================================
# SplitTheBill — PRODUCTION Configuration
# H2 file-based database — persists data on disk at /opt/splitthebill/data/
# ============================================================

spring.application.name=splitthebill

# ─── H2 Database (file-based for production — data persists on EC2) ──
spring.datasource.url=jdbc:h2:file:/opt/splitthebill/data/splitdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — DISABLED in prod (security)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Redis — running on same EC2 instance
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT — use a strong secret via env var
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Frontend URL
app.frontend-url=${FRONTEND_URL}

# AWS S3 (optional)
app.aws.bucket-name=splitthebill-pdfs
app.aws.region=${AWS_REGION:ap-south-1}
app.aws.access-key=${AWS_ACCESS_KEY:}
app.aws.secret-key=${AWS_SECRET_KEY:}

# Gemini AI — set GEMINI_API_KEY in /opt/splitthebill/.env
app.gemini.api-key=${GEMINI_API_KEY:}

# Logging
logging.level.com.hotelsplit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.file.name=/var/log/splitthebill/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
