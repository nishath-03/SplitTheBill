<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1a2e"/>
  <!-- Receipt/bill shape -->
  <rect x="16" y="10" width="32" height="38" rx="3" ry="3" fill="#e8f4fd" />
  <!-- Torn bottom edge of receipt -->
  <polygon points="16,48 19,44 22,48 25,44 28,48 31,44 34,48 37,44 40,48 43,44 46,48 48,48 48,10 16,10" fill="#e8f4fd"/>
  <polygon points="16,48 19,44 22,48 25,44 28,48 31,44 34,48 37,44 40,48 43,44 46,48 46,54 40,54 37,58 34,54 28,54 25,58 22,54 16,54" fill="#ffffff"/>
  <!-- Bill lines -->
  <rect x="22" y="17" width="20" height="2.5" rx="1.2" fill="#4a90d9"/>
  <rect x="22" y="23" width="14" height="2" rx="1" fill="#aac8e8"/>
  <rect x="22" y="28" width="18" height="2" rx="1" fill="#aac8e8"/>
  <rect x="22" y="33" width="12" height="2" rx="1" fill="#aac8e8"/>
  <!-- Dollar sign -->
  <text x="37" y="39" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2ecc71">$</text>
  <!-- Split symbol - two arrows -->
  <path d="M 28 50 Q 25 54 22 50" stroke="#4a90d9" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 36 50 Q 39 54 42 50" stroke="#4a90d9" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>